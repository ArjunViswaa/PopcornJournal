server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # client-side routes fall back to the app shell
    location / {
        try_files $uri /index.html;
    }
}
