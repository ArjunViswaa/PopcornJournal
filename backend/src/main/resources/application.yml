spring:
  application:
    name: popcorn-journal
  config:
    # KEY=VALUE lines in the repo-root .env are valid properties, so read them directly.
    # POPCORN_ENV_FILE overrides the location; tests point it at nothing.
    import: "optional:file:${POPCORN_ENV_FILE:../.env}[.properties],optional:file:${POPCORN_ENV_FILE:./.env}[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn}
    username: ${DB_USER:popcorn}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # local-only by default; see README before changing this
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

popcorn:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}
  import:
    # recorded with viewing method OTHER rather than STREAMING
    non-streaming-platforms: YTS,5movierulz

logging:
  level:
    org.hibernate.SQL: warn
